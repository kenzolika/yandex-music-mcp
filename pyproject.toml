[project]
name = "yandex-music-mcp"
version = "0.2.1"
description = "Unofficial Yandex Music MCP server: search, likes, history, My Wave, playlists for Claude and other MCP clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kenzolika" }]
dependencies = [
    "mcp>=1.10,<2",
    "yandex-music>=3.0,<4",
]
keywords = ["mcp", "yandex-music", "claude", "model-context-protocol", "playlists"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/kenzolika/yandex-music-mcp"
PyPI = "https://pypi.org/project/yandex-music-mcp/"
Repository = "https://github.com/kenzolika/yandex-music-mcp"
Issues = "https://github.com/kenzolika/yandex-music-mcp/issues"
Changelog = "https://github.com/kenzolika/yandex-music-mcp/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
yandex-music-mcp = "yandex_music_mcp.server:main"
yandex-music-mcp-auth = "yandex_music_mcp.auth:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yandex_music_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Defaults only (pyflakes + a few pycodestyle errors). No formatter, so existing style stays put.
select = ["E4", "E7", "E9", "F"]
